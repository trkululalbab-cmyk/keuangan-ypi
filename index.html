<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Keuangan YPI Ulul Albab</title>
  <meta name="description" content="Sistem Keuangan Yayasan Pendidikan Islam Ulul Albab Tarakan">
  <meta name="theme-color" content="#063c40">

  <!-- Agar bisa dipasang sebagai aplikasi -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Keuangan YPI">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --deep: #063c40;
      --teal: #0f969c;
      --accent: #f9812a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--deep);
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    /* Web app Sistem Keuangan, mengisi seluruh layar */
    #app {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height: calc(100% - env(safe-area-inset-top, 0px));
      border: 0;
      background: #f4f7f7;
      opacity: 0;
      transition: opacity .35s ease;
    }
    #app.ready { opacity: 1; }

    /* Layar pembuka */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 32px;
      color: #fff;
      text-align: center;
      background: linear-gradient(150deg, #052f33 0%, var(--deep) 45%, #0b787d 100%);
      transition: opacity .35s ease, visibility .35s;
    }
    #splash.hide { opacity: 0; visibility: hidden; }

    .logo-wrap {
      width: 118px;
      height: 118px;
      border-radius: 30px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, .07);
      border: 1px solid rgba(255, 255, 255, .12);
    }
    .logo-wrap img { width: 92px; height: auto; display: block; }

    #splash h1 {
      margin: 6px 0 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .2px;
    }
    #splash p {
      margin: 0;
      color: rgba(255, 255, 255, .7);
      font-size: 14px;
      line-height: 1.5;
    }

    .bar {
      width: 140px;
      height: 3px;
      margin-top: 10px;
      border-radius: 3px;
      overflow: hidden;
      background: rgba(255, 255, 255, .14);
    }
    .bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background: var(--accent);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }

    /* Pesan bila lambat atau tanpa internet */
    .notice {
      display: none;
      max-width: 320px;
      margin-top: 8px;
      color: rgba(255, 255, 255, .78);
      font-size: 13.5px;
      line-height: 1.55;
    }
    .notice.show { display: block; }
    .actions { display: none; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .actions.show { display: flex; }
    .actions button, .actions a {
      min-height: 42px;
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .actions .primary { background: #fff; color: var(--deep); }
    .actions .ghost { background: rgba(255, 255, 255, .12); color: #fff; }
    .actions button:focus-visible, .actions a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      .bar span { animation: none; width: 100%; }
      #app, #splash { transition: none; }
    }
  </style>
</head>
<body>

  <div id="splash" role="status" aria-live="polite">
    <div class="logo-wrap"><img src="icons/logo.webp" alt="Logo Ulul Albab"></div>
    <div>
      <h1>Keuangan YPI Ulul Albab</h1>
      <p>Yayasan Pendidikan Islam Ulul Albab Tarakan</p>
    </div>
    <div class="bar" id="bar"><span></span></div>
    <div class="notice" id="notice"></div>
    <div class="actions" id="actions">
      <button type="button" class="primary" id="retry">Muat ulang</button>
      <a class="ghost" id="openBrowser" target="_blank" rel="noopener">Buka di browser</a>
    </div>
  </div>

  <iframe id="app" title="Sistem Keuangan YPI Ulul Albab Tarakan"
          allow="clipboard-read; clipboard-write; fullscreen"></iframe>

  <script>
    /* =====================================================
       ALAMAT WEB APP
       Ganti hanya bila alamat deployment Apps Script berubah.
       ===================================================== */
    const APP_URL =
      "https://script.google.com/macros/s/AKfycbyq1Tl_PFYqwcgALjYL_2qkP_p6uMedVH55lI6KNIoL0rQXuYFi_mFpWhKqva9-AgU5uw/exec";

    const frame = document.getElementById("app");
    const splash = document.getElementById("splash");
    const notice = document.getElementById("notice");
    const actions = document.getElementById("actions");
    const bar = document.getElementById("bar");
    document.getElementById("openBrowser").href = APP_URL;

    let slowTimer = null;

    function showNotice(text) {
      notice.textContent = text;
      notice.classList.add("show");
      actions.classList.add("show");
    }

    function start() {
      notice.classList.remove("show");
      actions.classList.remove("show");
      bar.style.display = "";
      splash.classList.remove("hide");
      frame.classList.remove("ready");

      if (!navigator.onLine) {
        bar.style.display = "none";
        showNotice("Tidak ada koneksi internet. Sambungkan perangkat ke internet, lalu tekan Muat ulang.");
        return;
      }

      clearTimeout(slowTimer);
      slowTimer = setTimeout(function () {
        showNotice("Koneksi sedang lambat. Tunggu sebentar, atau tekan Muat ulang.");
      }, 15000);

      /* Pastikan server Google benar-benar terjangkau. Wi-Fi yang
         tersambung tanpa internet tetap dianggap "online" oleh browser. */
      checkConnection().then(function (ok) {
        if (!ok) {
          clearTimeout(slowTimer);
          bar.style.display = "none";
          showNotice("Tidak dapat terhubung ke server. Periksa koneksi internet, lalu tekan Muat ulang.");
          return;
        }
        frame.src = APP_URL + (APP_URL.indexOf("?") === -1 ? "?" : "&") + "app=1";
      });
    }

    function checkConnection() {
      const probe = fetch("https://script.google.com/favicon.ico?t=" + Date.now(), {
        mode: "no-cors",
        cache: "no-store"
      }).then(function () { return true; }).catch(function () { return false; });
      const timeout = new Promise(function (resolve) { setTimeout(function () { resolve(false); }, 10000); });
      return Promise.race([probe, timeout]);
    }

    frame.addEventListener("load", function () {
      if (!frame.src) return;
      clearTimeout(slowTimer);
      frame.classList.add("ready");
      /* Beri jeda singkat agar tampilan web app sempat tergambar */
      setTimeout(function () { splash.classList.add("hide"); }, 600);
    });

    document.getElementById("retry").addEventListener("click", start);
    window.addEventListener("online", function () {
      if (!frame.classList.contains("ready")) start();
    });

    start();

    /* Simpan berkas aplikasi agar layar pembuka tetap tampil saat offline */
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
